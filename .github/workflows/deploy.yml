name: Deploy Customer Churn API

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      action:
        description: "Action to perform on the server"
        required: true
        default: "deploy"
        type: choice
        options:
          - deploy
          - start
          - stop
          - restart
          - status
          - logs

env:
  APP_DIR: /opt/customer-churn-platform
  IMAGE_NAME: customer-churn-api
  CONTAINER_NAME: customer-churn-api
  HOST_PORT: 8000
  CONTAINER_PORT: 8000

jobs:
  deploy:
    name: Manage Customer Churn API
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------
      # Checkout repository
      # ------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # Configure SSH
      # ------------------------------------------------------
      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      # ------------------------------------------------------
      # Add server to known_hosts
      # ------------------------------------------------------
      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts

      # ------------------------------------------------------
      # Deploy / manage container
      # ------------------------------------------------------
      - name: Manage server
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          ACTION: ${{ github.event.inputs.action || 'deploy' }}
        run: |
          ssh "${SERVER_USER}@${SERVER_HOST}" << EOF
            set -e

            echo "======================================"
            echo "Customer Churn API"
            echo "Action: ${ACTION}"
            echo "======================================"

            cd "${APP_DIR}"

            case "${ACTION}" in

              deploy)
                echo "Pulling latest code..."
                git fetch origin main
                git reset --hard origin/main

                echo "Stopping existing container..."
                docker stop "${CONTAINER_NAME}" 2>/dev/null || true

                echo "Removing existing container..."
                docker rm "${CONTAINER_NAME}" 2>/dev/null || true

                echo "Building Docker image..."
                docker build \
                  -t "${IMAGE_NAME}:latest" \
                  .

                echo "Starting new container..."
                docker run -d \
                  --name "${CONTAINER_NAME}" \
                  --restart unless-stopped \
                  --env-file .env \
                  -p "${HOST_PORT}:${CONTAINER_PORT}" \
                  "${IMAGE_NAME}:latest"

                echo "Waiting for application..."
                sleep 5

                echo "Container status:"
                docker ps \
                  --filter "name=${CONTAINER_NAME}"

                echo "Deployment complete."
                ;;

              start)
                echo "Starting container..."

                docker start "${CONTAINER_NAME}" 2>/dev/null \
                  || docker run -d \
                    --name "${CONTAINER_NAME}" \
                    --restart unless-stopped \
                    --env-file .env \
                    -p "${HOST_PORT}:${CONTAINER_PORT}" \
                    "${IMAGE_NAME}:latest"

                echo "Container started."
                ;;

              stop)
                echo "Stopping container..."

                docker stop "${CONTAINER_NAME}" 2>/dev/null || true

                echo "Container stopped."
                ;;

              restart)
                echo "Restarting container..."

                docker restart "${CONTAINER_NAME}"

                echo "Container restarted."
                ;;

              status)
                echo "Container status:"
                docker ps \
                  --filter "name=${CONTAINER_NAME}" \
                  --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

                echo ""
                echo "Docker image:"
                docker images "${IMAGE_NAME}"
                ;;

              logs)
                echo "Container logs:"
                docker logs --tail 100 "${CONTAINER_NAME}"
                ;;

              *)
                echo "Unknown action: ${ACTION}"
                exit 1
                ;;

            esac
          EOF